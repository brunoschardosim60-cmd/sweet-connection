<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nexa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c221e"/>
      <stop offset="100%" stop-color="#111512"/>
    </linearGradient>
    <linearGradient id="nexa-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9ff38"/>
      <stop offset="100%" stop-color="#b5f500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#ccff00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded container background matching Nexa ink tone -->
  <rect width="512" height="512" rx="128" fill="url(#nexa-bg)"/>

  <!-- Subtle inner border for premium feel -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8"/>

  <!-- Nexa N emblem -->
  <path
    d="M136 384V128L376 384V128"
    fill="none"
    stroke="url(#nexa-lime)"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
